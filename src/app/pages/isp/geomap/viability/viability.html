<section class="erp-page" [@fadeIn]>
  <mat-card class="erp-card">
    <header class="erp-header">
      <div>
        <h1>GeoMap Viability</h1>
        <p>Check service viability by coordinates.</p>
      </div>
    </header>

    <div class="form-section">
      <div class="form-header">
        <div>
          <h2>Viability Check</h2>
          <p>Enter coordinates and radius to validate coverage.</p>
        </div>
      </div>
      <form [formGroup]="form" class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Latitude</mat-label>
          <input matInput type="number" formControlName="lat" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Longitude</mat-label>
          <input matInput type="number" formControlName="lng" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Radius (m)</mat-label>
          <input matInput type="number" formControlName="radiusM" />
        </mat-form-field>
        <mat-checkbox formControlName="requireFreePort">Require free port</mat-checkbox>
      </form>
      <div class="form-actions">
        <button mat-flat-button color="primary" (click)="check()" [disabled]="loading()">Check</button>
      </div>
    </div>

    <div class="form-section">
      <div class="form-header">
        <div>
          <h2>Result</h2>
          <p>Latest viability response.</p>
        </div>
      </div>
      @if (error()) {
        <div class="error">{{ error() }}</div>
      }
      <div class="result-box">
        <pre>{{ result() | json }}</pre>
      </div>
    </div>
  </mat-card>
</section>
