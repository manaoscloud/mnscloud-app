<section class="erp-page" [@fadeIn]>
  <mat-card class="erp-card">
    <header class="erp-header">
      <div>
        <h1>GeoMap Capacity</h1>
        <p>Check capacity for CTO and PON.</p>
      </div>
    </header>

    <div class="form-section">
      <div class="form-header">
        <div>
          <h2>Capacity Checks</h2>
          <p>Load capacity data for CTO or PON assets.</p>
        </div>
      </div>

      <div class="panel-grid">
        <div class="panel-card">
          <div class="panel-header">
            <h3>CTO Capacity</h3>
          </div>
          <form [formGroup]="ctoForm" class="form-grid">
            <mat-form-field appearance="outline" class="span-full">
              <mat-label>CTO UUID</mat-label>
              <input matInput formControlName="ctoUUID" />
            </mat-form-field>
          </form>
          <div class="form-actions">
            <button mat-flat-button color="primary" (click)="loadCto()" [disabled]="loading()">Load</button>
          </div>
          <div class="result-box">
            <pre>{{ ctoCapacity() | json }}</pre>
          </div>
        </div>

        <div class="panel-card">
          <div class="panel-header">
            <h3>PON Capacity</h3>
          </div>
          <form [formGroup]="ponForm" class="form-grid">
            <mat-form-field appearance="outline" class="span-full">
              <mat-label>PON UUID</mat-label>
              <input matInput formControlName="ponUUID" />
            </mat-form-field>
          </form>
          <div class="form-actions">
            <button mat-flat-button color="primary" (click)="loadPon()" [disabled]="loading()">Load</button>
          </div>
          <div class="result-box">
            <pre>{{ ponCapacity() | json }}</pre>
          </div>
        </div>
      </div>
    </div>

    @if (error()) {
      <div class="error">{{ error() }}</div>
    }
  </mat-card>
</section>
