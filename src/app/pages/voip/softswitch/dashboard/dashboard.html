<mns-dashboard-page
  class="softswitch-dashboard"
  [title]="'Softswitch Dashboard'"
  [description]="'Operational health, accounts, subscribers, trunks and routing.'"
  [loading]="dashboardResource.isLoading()"
  [error]="dashboardResource.error()"
  [hasData]="dashboardResource.hasData()"
  (refresh)="refreshList()"
>
  <div class="dashboard-content">
    <div class="dashboard-grid">
      @for (item of kpis(); track item.label) {
        <a
          class="dashboard-metric"
          [routerLink]="item.route || null"
          [class.is-static]="!item.route"
          ><mat-icon>{{ item.icon }}</mat-icon>
          <div>
            <span class="dashboard-metric-label">{{ item.label | transloco }}</span>
            <strong class="dashboard-metric-value">{{ item.value }}</strong>
          </div></a
        >
      }
    </div>

    <section class="dashboard-panel">
      <h2>{{ 'Server Health' | transloco }}</h2>
      <mns-global-table [config]="serverTable" [rows]="servers()" [loading]="loading()" />
    </section>
  </div>
</mns-dashboard-page>
