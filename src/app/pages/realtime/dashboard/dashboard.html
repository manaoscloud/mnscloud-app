<mns-dashboard-page
  class="realtime-dashboard"
  [title]="title()"
  [description]="subtitle()"
  [loading]="snapshotResource.isLoading()"
  [error]="snapshotResource.error()"
  [hasData]="snapshotResource.hasData()"
  (refresh)="refreshList()"
>
  <div class="dashboard-content">
    <div class="dashboard-grid">
      @for (item of kpis(); track item.label) {
        <article class="dashboard-metric">
          <mat-icon>{{ item.icon }}</mat-icon>
          <div>
            <span class="dashboard-metric-label">{{ item.label | transloco }}</span>
            <strong class="dashboard-metric-value">{{ item.value }}</strong>
            <small class="dashboard-metric-hint">{{ item.detail | transloco }}</small>
          </div>
        </article>
      }
    </div>

    <div class="dashboard-sections">
      <mns-dashboard-record-list
        [title]="primaryTitle()"
        [items]="primaryRows()"
        [emptyLabel]="noPrimaryLabel()"
      />
      <mns-dashboard-record-list
        [title]="secondaryTitle()"
        [items]="secondaryRows()"
        [emptyLabel]="noSecondaryLabel()"
      />
    </div>
  </div>
</mns-dashboard-page>
