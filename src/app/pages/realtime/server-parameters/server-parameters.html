<mns-settings-page
  [title]="config.title"
  [description]="config.description"
  [loading]="loading()"
  [saving]="saving()"
  [dirty]="hasChanges()"
  [error]="feedback()"
  [success]="success()"
  (refresh)="refresh()"
  (cancel)="cancel()"
  (save)="save()"
>
  <form class="form-grid">
    <div class="span-4 settings-page-toggle">
      <mat-slide-toggle
        [checked]="form().autoDomainEnabled"
        (change)="update({ autoDomainEnabled: $event.checked })"
      >
        {{ config.toggle | transloco }}
      </mat-slide-toggle>
    </div>

    <mns-search-select-field
      data-quick-create-exempt="DNS policies require explicit authorization in the owning DNS domain."
      fieldClass="span-2"
      data-field-key="dnsPolicyUUID"
      [label]="config.policyLabel | transloco"
      [options]="dns.options()"
      [remoteSearch]="true"
      [loading]="dns.loading()"
      [loadError]="dns.loadError()"
      [hasPrevious]="dns.offset() > 0"
      [hasNext]="dns.hasNext()"
      (searchChange)="dns.search($event)"
      (pageChange)="dns.page($event)"
      (openedChange)="$event && dns.refresh()"
      [value]="form().dnsPolicyUUID"
      [invalid]="invalid('dnsPolicyUUID')"
      [errorMessage]="'form.validation.required' | transloco"
      [help]="config.policyHelp | transloco"
      (valueChange)="selectDnsPolicy($event)"
    />

    <mat-form-field appearance="outline" class="span-1">
      <mat-label>{{ 'Domain label' | transloco }}</mat-label>
      <input matInput [value]="'Short UUID' | transloco" readonly />
      <mns-field-help
        matIconSuffix
        [label]="'Domain label' | transloco"
        [text]="config.labelHelp | transloco"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-1">
      <mat-label>{{ 'UUID length' | transloco }}</mat-label>
      <input
        matInput
        type="number"
        min="8"
        max="32"
        data-field-key="autoDomainUuidLength"
        [value]="form().autoDomainUuidLength"
        [mnsInvalid]="invalid('autoDomainUuidLength')"
        (input)="update({ autoDomainUuidLength: numberValue($event) })"
      />
      <mns-field-help
        matIconSuffix
        [label]="'UUID length' | transloco"
        [text]="
          'Character length of the random short UUID prefix (between 8 and 32 characters).'
            | transloco
        "
      />
      <mat-error>{{ 'Enter a number between 8 and 32.' | transloco }}</mat-error>
    </mat-form-field>

    @if (policyError(); as error) {
      <p class="span-4 settings-page-feedback" role="alert">{{ error | transloco }}</p>
    }
  </form>
</mns-settings-page>
