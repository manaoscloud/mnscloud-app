<main class="page-wrapper" animate.enter="app-fade-in">
  <mat-card class="auth-card">
    <h1 class="mat-headline-small title">Recover Password 🔐</h1>
    <p class="subtitle mat-body-medium">Enter your email to receive reset instructions.</p>

    <form (submit)="onSubmit($event)" novalidate autocomplete="off">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          [formField]="form.email"
          autocomplete="email"
          placeholder="name@example.com"
        />
        <mat-icon matSuffix>mail</mat-icon>
        @if (emailError()) {
          <mat-error>{{ emailError() }}</mat-error>
        }
      </mat-form-field>

      <!-- Mensagem neutra -->
      @if (infoMessage()) {
        <p class="info-message">
          {{ infoMessage() }}
        </p>
      }

      <button
        mat-flat-button
        color="primary"
        class="submit-btn"
        type="submit"
        [disabled]="!canSubmit"
      >
        @if (!isLoading()) {
          Send Instructions
        } @else {
          <mat-spinner diameter="22" />
        }
      </button>
    </form>

    <p class="link-row">
      <a routerLink="/signin">Back to Sign In</a>
    </p>
  </mat-card>
</main>
