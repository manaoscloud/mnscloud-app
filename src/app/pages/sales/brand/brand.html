<section class="erp-page" animate.enter="app-fade-in">
  <mat-card class="erp-card">
    <header class="erp-header">
      <div>
        <h1>Brand</h1>
        <p>Register brand definitions used in sales.</p>
      </div>

      <div class="header-actions">
        <app-refresh-button [loading]="loading()" (refresh)="refreshList()" />
        <button mat-stroked-button color="primary" (click)="openCreateDialog()" type="button">
          <mat-icon>add</mat-icon>
          New
        </button>
      </div>
    </header>

    <div class="filter-grid">
      <mns-text-field [field]="filterForm.name" label="Name" placeholder="Search by name" />

      <div class="filter-actions">
        <button mat-stroked-button (click)="applyFilters()" type="button">
          <mat-icon>filter_alt</mat-icon>
          {{ 'Apply' | transloco }}
        </button>
        <button mat-stroked-button (click)="clearFilters()" type="button">
          <mat-icon>backspace</mat-icon>
          {{ 'Clear' | transloco }}
        </button>
      </div>
    </div>

    <div class="table-wrapper mat-elevation-z8" [class.is-loading]="loading()">
      @if (loading()) {
        <div class="table-loading" aria-live="polite" aria-busy="true">
          <mat-progress-spinner diameter="36" mode="indeterminate" />
        </div>
      }
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let row">{{ row.SbrName }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row">
            <div class="actions-col">
              <button mat-icon-button (click)="openEditDialog(row)" type="button" matTooltip="Edit">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteBrand(row)" matTooltip="Delete">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            {{ loading() ? 'Loading brands...' : 'No brands found.' }}
          </td>
        </tr>
      </table>
    </div>
    <mat-paginator
      class="mobile-paginator"
      [pageSizeOptions]="[5, 10, 25, 100]"
      showFirstLastButtons
      aria-label="Select page of brands"
    />
  </mat-card>
</section>

<ng-template #brandFormDialog>
  <div class="crud-dialog">
    <div class="form-header">
      <div>
        <h2>{{ editing() ? 'Edit brand' : 'New brand' }}</h2>
        <p>Create a brand for catalog and sales.</p>
      </div>
    </div>

    <mat-dialog-content class="dialog-content">
      <mat-tab-group class="form-tabs">
        <mat-tab [label]="'Record' | transloco">
          <div class="tab-content">
            <form class="form-grid" (ngSubmit)="saveBrand()">
              <mns-text-field [field]="brandForm.name" label="Name" placeholder="e.g. mnscloud" />
            </form>
          </div>
        </mat-tab>
      </mat-tab-group>
    </mat-dialog-content>

    <mat-dialog-actions class="form-actions">
      <button
        mat-flat-button
        color="primary"
        type="button"
        (click)="saveBrand()"
        [disabled]="!brandForm().valid() || saving()"
      >
        <mat-icon>save</mat-icon>
        Save
      </button>
      <button mat-stroked-button type="button" (click)="cancelEdit()">Cancel</button>
      @if (error()) {
        <span class="error">{{ error() }}</span>
      }
    </mat-dialog-actions>
  </div>
</ng-template>
