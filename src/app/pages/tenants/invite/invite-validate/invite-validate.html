@if (loading()) {
  <app-state-message
    layout="page"
    type="empty"
    icon="hourglass_top"
    [title]="'Validating invitation...' | transloco"
    [message]="'Please wait while we validate your invitation link.' | transloco"
  />
} @else {
  @if (error()) {
    <app-state-message
      layout="page"
      type="error"
      icon="link_off"
      [title]="'Invitation not available' | transloco"
      [message]="error()!"
      [primaryLabel]="'Back to Sign In' | transloco"
      [primaryAction]="goSignin"
      [secondaryLabel]="'Go to Dashboard' | transloco"
      [secondaryAction]="goHome"
    />
  } @else {
    @if (invite(); as i) {
      <app-state-message
        layout="page"
        type="empty"
        icon="mail"
        [title]="'Invitation' | transloco"
        [message]="'Review the invitation details and continue when ready.' | transloco"
        [details]="[
          { label: ('Environment' | transloco), value: i.EnvironmentName || '-' },
          { label: ('Email' | transloco), value: i.InviteEmail || '-' },
          { label: ('Access profile' | transloco), value: i.RoleName || i.RoleCode || '-' },
        ]"
        [primaryLabel]="'Continue' | transloco"
        [primaryAction]="goToCurrentInvite"
        [secondaryLabel]="'Back to Sign In' | transloco"
        [secondaryAction]="goSignin"
      />
    }
  }
}
