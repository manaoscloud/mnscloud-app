<mns-dashboard-page
  class="storage-dashboard"
  [title]="'Storage Dashboard'"
  [description]="'Provider, account, and bucket readiness for private storage operations.'"
  [loading]="dashboardResource.isLoading()"
  [error]="dashboardResource.error()"
  [hasData]="dashboardResource.hasData()"
  (refresh)="refreshList()"
>
  <div class="dashboard-content">
    <div class="dashboard-grid">
      @for (item of kpis(); track item.label) {
        <article class="dashboard-metric" [ngClass]="'state-' + item.state">
          <mat-icon>{{ item.icon }}</mat-icon>
          <div>
            <span class="dashboard-metric-label">{{ item.label | transloco }}</span>
            <strong class="dashboard-metric-value">{{ item.value }}</strong>
            <small class="dashboard-metric-hint"
              >{{ item.detailValue }} {{ item.detailLabel | transloco }}</small
            >
          </div>
        </article>
      }
    </div>

    <div class="dashboard-sections">
      <mns-dashboard-record-list
        [title]="'Storage Provider Readiness'"
        [items]="providerRows()"
        [emptyLabel]="'No storage providers found.'"
      />
      <mns-dashboard-record-list
        [title]="'Storage Accounts'"
        [items]="accountRows()"
        [emptyLabel]="'No storage accounts found. Create an account and set the Bucket on the Storage tab.'"
      />
    </div>

    <mns-dashboard-record-list
      [title]="'Provider Types'"
      [items]="typeRows()"
      [emptyLabel]="'No storage provider types found.'"
    />
  </div>
</mns-dashboard-page>
