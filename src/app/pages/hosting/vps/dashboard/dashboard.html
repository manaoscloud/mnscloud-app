<mns-dashboard-page
  class="vps-dashboard"
  [title]="'VPS Dashboard'"
  [description]="'Instance health, provider readiness, and plan capacity for VPS operations.'"
  [loading]="dashboardResource.isLoading()"
  [error]="dashboardResource.error()"
  [hasData]="dashboardResource.hasData()"
  (refresh)="refreshList()"
>
  <div class="dashboard-content">
    <div class="dashboard-grid">
      @for (item of kpis(); track item.label) {
        <article class="dashboard-metric" [ngClass]="'state-' + item.state">
          <mat-icon>{{ item.icon }}</mat-icon>
          <div>
            <span class="dashboard-metric-label">{{ item.label | transloco }}</span>
            <strong class="dashboard-metric-value">{{ item.value }}</strong>
            <small class="dashboard-metric-hint"
              >{{ item.detailValue }} {{ item.detailLabel | transloco }}</small
            >
          </div>
        </article>
      }
    </div>

    <nav class="panel-header" [attr.aria-label]="'VPS resources' | transloco">
      <a [routerLink]="routeTo('instances')">
        <mat-icon>open_in_new</mat-icon>
        {{ 'Instances' | transloco }}
      </a>
      <a [routerLink]="routeTo('provider')">
        <mat-icon>open_in_new</mat-icon>
        {{ 'Provider' | transloco }}
      </a>
      <a [routerLink]="routeTo('plans')">
        <mat-icon>open_in_new</mat-icon>
        {{ 'Plans' | transloco }}
      </a>
    </nav>

    <div class="dashboard-sections">
      <mns-dashboard-record-list
        [title]="'Instance Status'"
        [items]="statusRows()"
        [emptyLabel]="'No VPS instances found.'"
      />
      <mns-dashboard-record-list
        [title]="'Provider Readiness'"
        [items]="providerRows()"
        [emptyLabel]="'No VPS providers found.'"
      />
    </div>

    <mns-dashboard-record-list
      [title]="'Plan Capacity'"
      [items]="planRows()"
      [emptyLabel]="'No VPS plans found.'"
    />
  </div>
</mns-dashboard-page>
