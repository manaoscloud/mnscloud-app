<mns-dashboard-page
  class="vps-container-dashboard"
  [title]="'VPS Container Dashboard'"
  [description]="'Container instance health, provider readiness, and plan capacity for container operations.'"
  [loading]="dashboardResource.isLoading()"
  [error]="dashboardResource.error()"
  [hasData]="dashboardResource.hasData()"
  (refresh)="refreshList()"
>
  <div class="dashboard-content">
    <div class="dashboard-grid">
      @for (item of kpis(); track item.label) {
        <article class="dashboard-metric" [ngClass]="'state-' + item.state">
          <mat-icon>{{ item.icon }}</mat-icon>
          <div>
            <span class="dashboard-metric-label">{{ item.label | transloco }}</span>
            <strong class="dashboard-metric-value">{{ item.value }}</strong>
            <small class="dashboard-metric-hint"
              >{{ item.detailValue }} {{ item.detailLabel | transloco }}</small
            >
          </div>
        </article>
      }
    </div>

    <div class="dashboard-sections">
      <mns-dashboard-record-list
        [title]="'Container Status'"
        [items]="statusRows()"
        [emptyLabel]="'No container instances found.'"
      />
      <mns-dashboard-record-list
        [title]="'Provider Readiness'"
        [items]="providerRows()"
        [emptyLabel]="'No container providers found.'"
      />
    </div>

    <mns-dashboard-record-list
      [title]="'Container Plan Capacity'"
      [items]="planRows()"
      [emptyLabel]="'No container plans found.'"
    />
  </div>
</mns-dashboard-page>
