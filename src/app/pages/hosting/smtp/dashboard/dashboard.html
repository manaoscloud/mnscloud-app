<mns-dashboard-page
  title="SMTP Dashboard"
  description="Provider, account, and routing health for SMTP delivery."
  [loading]="dashboard.isLoading()"
  [error]="dashboard.error()"
  [hasData]="dashboard.hasData()"
  (refresh)="dashboard.reload()"
>
  <div class="dashboard-grid">
    @for (item of kpis(); track item.label) {
      <article class="dashboard-metric">
        <mat-icon>{{ item.icon }}</mat-icon>
        <div>
          <span class="dashboard-metric-label">{{ item.label | transloco }}</span>
          <strong class="dashboard-metric-value">{{ item.value }}</strong>
          <small class="dashboard-metric-hint">{{ item.hint }} {{ item.detail | transloco }}</small>
        </div>
      </article>
    }
  </div>
  <div class="dashboard-sections">
    <mns-dashboard-record-list
      title="Provider Readiness"
      emptyLabel="No SMTP providers found."
      [items]="providerRecords()"
      [sortOptions]="providerSort"
      [sortActive]="providerTable.sortActive()"
      [sortDirection]="providerTable.sortDirection()"
      (sortChange)="providerTable.setSort($event)"
      [total]="providerTable.sortedRows().length"
      [pageIndex]="providerTable.pageIndex()"
      [pageSize]="providerTable.pageSize()"
      (page)="providerTable.setPage($event)"
    >
      <a class="dashboard-nav-link" [routerLink]="routeTo('providers')">{{ 'Providers' | transloco }}</a>
    </mns-dashboard-record-list>
    <mns-dashboard-record-list
      title="Account Inventory"
      emptyLabel="No SMTP accounts found."
      [items]="accountRecords()"
      [sortOptions]="accountSort"
      [sortActive]="accountTable.sortActive()"
      [sortDirection]="accountTable.sortDirection()"
      (sortChange)="accountTable.setSort($event)"
      [total]="accountTable.sortedRows().length"
      [pageIndex]="accountTable.pageIndex()"
      [pageSize]="accountTable.pageSize()"
      (page)="accountTable.setPage($event)"
    >
      <a class="dashboard-nav-link" [routerLink]="routeTo('accounts')">{{ 'Accounts' | transloco }}</a>
    </mns-dashboard-record-list>
    <mns-dashboard-record-list
      title="Route Map"
      emptyLabel="No SMTP routes found."
      [items]="routeRecords()"
      [sortOptions]="routeSort"
      [sortActive]="routeTable.sortActive()"
      [sortDirection]="routeTable.sortDirection()"
      (sortChange)="routeTable.setSort($event)"
      [total]="routeTable.sortedRows().length"
      [pageIndex]="routeTable.pageIndex()"
      [pageSize]="routeTable.pageSize()"
      (page)="routeTable.setPage($event)"
    >
      <a class="dashboard-nav-link" [routerLink]="routeTo('routes')">{{ 'Routes' | transloco }}</a>
    </mns-dashboard-record-list>
  </div>
</mns-dashboard-page>
