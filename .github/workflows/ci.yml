name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional API base URL for this build, for example https://api.example.com/api/v1'
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Angular app
    runs-on: ubuntu-latest
    env:
      MNSCLOUD_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.MNSCLOUD_API_BASE_URL || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate changed application contract
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          npm run verify:changed -- "$BASE" HEAD
      - name: Generate runtime config
        run: |
          node -e '
            const fs = require("fs");
            const apiBaseUrl = process.env.MNSCLOUD_API_BASE_URL || "";
            const contents = `(function (window) {
              window.MNSCLOUD_APP_CONFIG = window.MNSCLOUD_APP_CONFIG || {
                apiBaseUrl: ${JSON.stringify(apiBaseUrl)},
              };
            })(window);
          `;
            fs.writeFileSync("public/env.js", contents);
          '
      - name: Setup Deno for release metadata
        if: github.ref == 'refs/heads/main'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1
      - name: Build release candidate
        if: github.ref == 'refs/heads/main'
        run: |
          bash scripts/prepare-release-candidate.sh --output release-candidate --source-sha "$GITHUB_SHA"
          bash scripts/release-app.sh --verify-promotion-artifact release-candidate
      - name: Build
        if: github.ref != 'refs/heads/main'
        run: npm run build
      - name: Upload browser build
        uses: actions/upload-artifact@v7
        with:
          name: mnscloud-app-browser
          path: dist/app/browser
          if-no-files-found: error
      - name: Upload release candidate
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: mnscloud-app-release-candidate
          path: release-candidate
          if-no-files-found: error
