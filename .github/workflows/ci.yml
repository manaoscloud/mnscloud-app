name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional API base URL for this build, for example https://api.example.com/api/v1'
        required: false
        type: string

# CI only reads the code: tests, builds and artifact uploads need no write access.
# Publishing happens in auto-release.yml, which declares its own permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Angular app
    runs-on: ubuntu-latest
    env:
      MNSCLOUD_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.MNSCLOUD_API_BASE_URL || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Extend swap for the Angular build
        # The production build peaks close to the hosted runner RAM (16 GB, ~190 CRUD pages compile
        # the shared CRUD template); past it the runner VM is shut down mid-build ("The runner has
        # received a shutdown signal"). A larger swap makes the peak slower instead of fatal.
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/mnscloud-build.swap
          sudo chmod 600 /mnt/mnscloud-build.swap
          sudo mkswap /mnt/mnscloud-build.swap >/dev/null
          sudo swapon /mnt/mnscloud-build.swap
          free -h
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate changed application contract
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A manual promotion validates the candidate commit. Earlier main commits
            # were already validated by their own CI runs.
            BASE="$(git rev-parse HEAD^)"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          npm run verify:changed -- "$BASE" HEAD
      - name: Test dependent remote lookup parameters
        run: node --test scripts/tests/login-appearance.test.mjs scripts/tests/remote-lookup-parameters.test.mjs scripts/tests/password-generation.test.mjs scripts/tests/record-uuid-label.test.mjs scripts/tests/crud-view-preferences.test.mjs scripts/tests/guarded-build.test.mjs scripts/tests/crud-report-mask.test.mjs scripts/tests/crud-suffix-projection.test.mjs scripts/tests/release-candidate-version.test.mjs scripts/tests/app-catalog.test.mjs scripts/tests/table-loading-overlay.test.mjs scripts/tests/package-item-payload.test.mjs
      - name: Test dashboard state and tenant isolation
        run: npm run test:dashboard
      - name: Test queued operations, cookie session isolation and problem reports
        run: ./node_modules/.bin/ng test --watch=false --include='src/app/shared/operations/*.spec.ts' --include='src/app/services/api-session-context.spec.ts' --include='src/app/shared/forms/mns-search-select-field/*.spec.ts' --include='src/app/pages/voip/pabx/parameters/parameters.spec.ts' --include='src/app/pages/billing/tenant/identity/identity.spec.ts' --include='src/app/pages/support/ai-settings/ai-settings.spec.ts' --include='src/app/pages/settings/ai-providers/ai-providers.spec.ts' --include='src/app/pages/settings/lookup-providers/lookup-providers.spec.ts' --include='src/app/shared/data-lookup/*.spec.ts' --include='src/app/pages/settings/ai-features/ai-features.spec.ts' --include='src/app/pages/settings/ai-dashboard/ai-dashboard.spec.ts' --include='src/app/shared/forms/field-help.spec.ts' --include='src/app/shared/crud/configurable-crud/crud-field-help.spec.ts' --include='src/app/pages/voip/pabx/trunk/*.spec.ts' --include='src/app/shared/install-command-dialog/*.spec.ts' --include='src/app/core/interceptors/api.interceptor.spec.ts' --include='src/app/core/navigation/*.spec.ts' --include='src/app/core/guards/session-guards.spec.ts' --include='src/app/services/client-diagnostics.service.spec.ts' --include='src/app/services/app-update.service.spec.ts' --include='src/app/shared/app-update/*.spec.ts' --include='src/app/services/support-report.service.spec.ts' --include='src/app/services/notification-inbox.service.spec.ts' --include='src/app/layout/navigation/*.spec.ts' --include='src/app/shared/support-report-dialog/*.spec.ts' --include='src/app/shared/menu/*.spec.ts' --include='src/app/shared/forms/field-validation.spec.ts' --include='src/app/shared/crud/configurable-crud/configurable-crud-required-feedback.spec.ts' --include='src/app/shared/crud/configurable-crud/configurable-crud-clearable-select.spec.ts' --include='src/app/shared/crud/configurable-crud/configurable-crud-view-column.spec.ts' --include='src/app/shared/crud/configurable-crud/configurable-crud-auto-select-all.spec.ts' --include='src/app/shared/message-layout/*.spec.ts' --include='src/app/shared/phone-dock/*.spec.ts' --include='src/app/pages/conversations/*.spec.ts' --include='src/app/services/help-video.service.spec.ts' --include='src/app/services/release-note.service.spec.ts' --include='src/app/pages/dashboard/dashboard.spec.ts' --include='src/app/shared/charts/*.spec.ts' --include='src/app/shared/monitoring/metrics-monitor/*.spec.ts' --include='src/app/pages/infragis/map/*.spec.ts' --include='src/app/pages/infragis/transfer/*.spec.ts' --include='src/app/pages/infragis/network/*.spec.ts' --include='src/app/pages/infragis/management/*.spec.ts' --include='src/app/pages/workorders/*.spec.ts' --include='src/app/pages/infragis/utilities/*.spec.ts' --include='src/app/pages/voip/did/*.spec.ts' --include='src/app/pages/hr/*.spec.ts' --karma-config=karma.dashboard.cjs
      - name: Generate runtime config
        run: |
          node -e '
            const fs = require("fs");
            const apiBaseUrl = process.env.MNSCLOUD_API_BASE_URL || "";
            const contents = `(function (window) {
              window.MNSCLOUD_APP_CONFIG = window.MNSCLOUD_APP_CONFIG || {
                apiBaseUrl: ${JSON.stringify(apiBaseUrl)},
              };
            })(window);
          `;
            fs.writeFileSync("public/env.js", contents);
          '
      - name: Gitleaks secret scan
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo --redact --verbose --exit-code=1
      - name: Trivy security scan
        run: |
          docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c fs --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code=1 --ignorefile /repo/.trivyignore /repo
      - name: Setup Deno for release metadata
        if: github.ref == 'refs/heads/main'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.1
      - name: Build release candidate
        if: github.ref == 'refs/heads/main'
        run: |
          bash scripts/prepare-release-candidate.sh --output release-candidate --source-sha "$GITHUB_SHA"
          bash scripts/release-app.sh --verify-promotion-artifact release-candidate
      - name: Build
        if: github.ref != 'refs/heads/main'
        run: npm run build
      - name: Upload browser build
        uses: actions/upload-artifact@v7
        with:
          name: mnscloud-app-browser
          path: dist/app/browser
          if-no-files-found: error
      - name: Upload release candidate
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: mnscloud-app-release-candidate
          path: release-candidate
          if-no-files-found: error
