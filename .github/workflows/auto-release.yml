name: Auto Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit emergency release version. Normal releases must be promoted from CI.'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: app-stable-release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote validated artifact
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'Release mnscloud-app '))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Verify source is current main
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1
      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install emergency release dependencies
        if: github.event_name == 'workflow_dispatch'
        run: npm ci
      - name: Download validated release candidate
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v7
        with:
          name: mnscloud-app-release-candidate
          path: ${{ runner.temp }}/mnscloud-app-release-candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Configure git author
        run: |
          git config user.name 'mnscloud-release-bot'
          git config user.email 'actions@users.noreply.github.com'
      - name: Prepare emergency release candidate
        if: github.event_name == 'workflow_dispatch'
        run: |
          bash scripts/prepare-release-candidate.sh \
            --output "$RUNNER_TEMP/mnscloud-app-release-candidate" \
            --source-sha "$GITHUB_SHA" \
            --version '${{ inputs.version }}'
          bash scripts/release-app.sh --verify-promotion-artifact "$RUNNER_TEMP/mnscloud-app-release-candidate"
      - name: Promote validated artifact
        if: github.event_name == 'workflow_run'
        run: bash scripts/release-app.sh --promote-artifact "$RUNNER_TEMP/mnscloud-app-release-candidate"
      - name: Promote emergency artifact
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/release-app.sh --promote-artifact "$RUNNER_TEMP/mnscloud-app-release-candidate"
      - name: Notify MNSCloud release cache
        env:
          MNSCLOUD_RELEASE_SYNC_URL: ${{ vars.MNSCLOUD_RELEASE_SYNC_URL || secrets.MNSCLOUD_RELEASE_SYNC_URL || '' }}
          MNSCLOUD_RELEASE_SYNC_TOKEN: ${{ secrets.MNSCLOUD_RELEASE_SYNC_TOKEN || secrets.MNSCLOUD_DEPLOY_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [ -z "$MNSCLOUD_RELEASE_SYNC_URL" ] || [ -z "$MNSCLOUD_RELEASE_SYNC_TOKEN" ]; then
            echo 'Release cache notification is not configured; skipped.'
            exit 0
          fi
          python3 - <<'PY' > /tmp/mnscloud-release-payload.json
          import json
          import subprocess

          with open('releases/manifest.json', encoding='utf-8') as handle:
              manifest = json.load(handle)
          stable = manifest['channels']['stable']
          artifact = stable['artifact']
          ref = stable['ref']
          # Runtime inventory reports the immutable release checkout.  The cache must
          # compare against that tag commit, never the source commit that built it.
          build_ref = subprocess.check_output(['git', 'rev-list', '-n', '1', ref], text=True).strip()
          print(json.dumps({
              'product': 'mnscloud-app',
              'channel': 'stable',
              'version': stable['version'],
              'ref': ref,
              'buildRef': build_ref[:12],
              'buildDate': stable['releasedAt'],
              'releasedAt': stable['releasedAt'],
              'notes': f'Synced from GitHub Actions release {ref}.',
              'artifactName': artifact['name'],
              'artifactUrl': f'https://github.com/{subprocess.check_output(["git", "config", "--get", "remote.origin.url"], text=True).strip().removesuffix(".git").removeprefix("https://github.com/")}/releases/download/{ref}/{artifact["name"]}',
              'artifactSha256': artifact['sha256'],
              'artifactSizeBytes': artifact['sizeBytes'],
              'artifactContentType': artifact['contentType'],
          }))
          PY
          base_url="${MNSCLOUD_RELEASE_SYNC_URL%/}"
          endpoint="${base_url}/runtime/releases/publish"
          [[ "$base_url" == */api/v1 ]] || endpoint="${base_url}/api/v1/runtime/releases/publish"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${MNSCLOUD_RELEASE_SYNC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data @/tmp/mnscloud-release-payload.json \
            "$endpoint"
