name: Reconcile Runtime Release Cache

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Published app tag to reconcile, for example v0.1.531. Leave empty for the latest release.'
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: app-runtime-release-cache
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile published stable release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MNSCLOUD_RELEASE_SYNC_URL: ${{ vars.MNSCLOUD_RELEASE_SYNC_URL || secrets.MNSCLOUD_RELEASE_SYNC_URL || '' }}
      MNSCLOUD_RELEASE_SYNC_TOKEN: ${{ secrets.MNSCLOUD_RELEASE_SYNC_TOKEN || secrets.MNSCLOUD_DEPLOY_TOKEN || '' }}
    steps:
      - name: Resolve published release
        id: release
        run: |
          set -euo pipefail
          ref='${{ inputs.ref || '' }}'
          if [ -z "$ref" ]; then
            ref="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          fi
          [[ "$ref" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid published release ref: $ref" >&2
            exit 2
          }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout reconciliation tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Synchronize MNSCloud release cache
        run: bash scripts/sync-runtime-release-cache.sh --ref '${{ steps.release.outputs.ref }}' --skip-if-current
